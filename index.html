<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Falling Text 3D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
<!-- PHẦN 1: MÃ QR -->
<div id="qr-section">
    <h1>🌸 Quét mã QR để nhận lời chúc 🎉</h1>
    <img id="qrImage" src="https://api.qrserver.com/v1/create-qr-code/?data=loichuc&size=200x200" alt="QR Code">
    <button id="startBtn">Bắt đầu quét</button>
</div>

<!-- PHẦN 2: QUÉT MÃ QR -->
<div id="scan-section">
    <h1>Đưa mã QR vào khung bên dưới 💗</h1>
    <div id="reader"></div>
</div>

<!-- PHẦN 3: HIỆU ỨNG CHỮ RƠI 3D -->
<div class="sparkle-container" id="sparkles"></div>
<div class="scene" id="scene"></div>
<audio id="sound" loop>
    <source src="./style/BatCocConTim.mp3" type="audio/mpeg" />
</audio>

<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
<script src="./style/script.js"></script>
</body>
</html>
